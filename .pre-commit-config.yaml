repos:
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.459
    hooks: [{id: checkov, args: ["--quiet", "--compact"]}]
  - repo: https://github.com/aquasecurity/tfsec
    rev: v1.28.14
    hooks: [{id: tfsec}]
  - repo: local
    hooks:
      - id: conftest
        name: conftest custom rego
        entry: conftest test -p policy
        language: system
        files: \.tf$
